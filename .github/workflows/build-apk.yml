name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore if missing
        run: |
          mkdir -p app
          for ks in debug.keystore app/debug.keystore; do
            if [ ! -f "$ks" ]; then
              keytool -genkeypair \
                -alias androiddebugkey \
                -keypass android \
                -keystore "$ks" \
                -storepass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000
            fi
          done

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-configuration-cache 2>&1 | tee build.log
        continue-on-error: false

      - name: Show concise error summary on failure
        if: failure()
        run: |
          echo "=== ROOT CAUSE SUMMARY ==="
          grep -E "(FAILURE:|What went wrong:|Execution failed|Caused by:|^e: )" build.log || tail -n 40 build.log

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherKeys-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
